# Sitio estático: Netlify publica la carpeta raíz tal cual, sin compilar.
# (El CV anterior en Vue quedó en la rama cv-vue-2024.)
[build]
  publish = "."
  command = "echo 'Sitio estático: no hay nada que compilar'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
